# Cập nhật mẫu tivi (26/10/2026): mỗi thứ Hai 08:00 giờ Việt Nam (hoặc bấm Run workflow) dựng lại danh sách tivi từ
# CleanYourTV mới nhất (scripts/cap_nhat_mau.py). Có thay đổi thì chạy unit test (kể cả chốt chặn chạy qua mọi mẫu):
#  - qua: commit lên main rồi gọi workflow Phát hành (bản vá). Từ bản trước mà thứ vào APK chỉ đổi ở dữ liệu mẫu tivi thì
#    tự phát hành không ai duyệt (môi trường phat-hanh-tu-dong); còn code chưa phát hành thì chờ chủ kho duyệt;
#  - không qua, hoặc bỏ quá nhiều mẫu một lần: đẩy nhánh mau-tivi/cap-nhat, mở pull request để xem (kho chưa cho Actions
#    tạo pull request thì mở issue trỏ tới nhánh), không phát hành, lần chạy báo lỗi.
# Cuối mỗi lần chạy: kho 45 ngày chưa có commit thì tạo một commit nhỏ để GitHub không tắt lịch (bước Giữ lịch chạy).
name: Cập nhật mẫu tivi

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: cap-nhat-mau
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Lấy CleanYourTV mới nhất
        run: git clone -q --depth 1 https://github.com/Gathin23/cleanyourtv "$RUNNER_TEMP/cleanyourtv"

      - name: Dựng lại danh sách tivi
        id: mau
        run: python3 scripts/cap_nhat_mau.py "$RUNNER_TEMP/cleanyourtv" >> "$GITHUB_OUTPUT"

      - name: Unit test
        id: test
        if: steps.mau.outputs.doi == '1'
        continue-on-error: true
        run: ./gradlew --console=plain :app:testReleaseUnitTest

      - name: "Ổn: commit và phát hành"
        if: steps.mau.outputs.doi == '1' && steps.test.outcome == 'success' && steps.mau.outputs.chan == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/du-lieu.json app/src/main/java/vn/tivikit/dulieu/DuLieu.kt app/src/main/assets/giay-phep.txt README.md
          git commit -q -F dist/mau-commit.txt
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          if python3 scripts/phat_hanh.py chi-du-lieu; then TU_DONG=true; else TU_DONG=false; fi
          gh workflow run phat-hanh.yml --ref "$GITHUB_REF_NAME" -f loai=va -f tu_dong=$TU_DONG -f ghi_chu="$(cat dist/mau-ghi-chu.txt)"
          if [ "$TU_DONG" = true ]; then CACH="tự phát hành"; else CACH="có code chưa phát hành nên chờ chủ kho duyệt"; fi
          echo "$(head -n 1 dist/mau-commit.txt) — $CACH" >> "$GITHUB_STEP_SUMMARY"

      - name: "Chưa ổn: mở pull request"
        if: steps.mau.outputs.doi == '1' && (steps.test.outcome != 'success' || steps.mau.outputs.chan != '')
        env:
          GH_TOKEN: ${{ github.token }}
          CHAN: ${{ steps.mau.outputs.chan }}
        run: |
          NHANH=mau-tivi/cap-nhat
          LAN_CHAY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$NHANH"
          git add app/src/main/assets/du-lieu.json app/src/main/java/vn/tivikit/dulieu/DuLieu.kt app/src/main/assets/giay-phep.txt README.md
          git commit -q -F dist/mau-commit.txt
          git push -q -f origin "$NHANH"
          BAO="Danh sách tivi mới từ CleanYourTV chưa phát hành: ${CHAN:-unit test không qua}. Nhánh: $NHANH. Log: $LAN_CHAY"
          if [ "$(gh pr view "$NHANH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr comment "$NHANH" --body "$BAO"
          elif ! gh pr create --head "$NHANH" --base "$GITHUB_REF_NAME" --title "$(head -n 1 dist/mau-commit.txt)" --body "$BAO"; then
            # Settings → Actions → General chưa bật "Allow GitHub Actions to create and approve pull requests".
            gh issue create --title "Cập nhật mẫu tivi chưa phát hành: $(head -n 1 dist/mau-commit.txt)" --body "$BAO"
          fi
          echo "::error::$BAO"
          exit 1

      # GitHub tắt workflow chạy theo lịch khi kho công khai 60 ngày không có hoạt động. Kho 45 ngày chưa có commit nào
      # (CleanYourTV ít đổi) thì ghi ngày vào .github/giu-lich.txt để có một commit; phat_hanh.py chi-du-lieu bỏ qua
      # .github/ nên không chặn bản tự phát hành. Chạy cả khi các bước trên lỗi.
      - name: Giữ lịch chạy
        if: always()
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          cuoi=$(git log -1 --format=%ct FETCH_HEAD)
          if [ $(( $(date +%s) - cuoi )) -lt $(( 45 * 86400 )) ]; then echo "Kho có commit trong 45 ngày qua, khỏi giữ lịch."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -f -B giu-lich FETCH_HEAD
          date -u +%Y-%m-%d > .github/giu-lich.txt
          git add .github/giu-lich.txt
          git commit -q -m "Nội bộ: giữ lịch Cập nhật mẫu tivi (kho 45 ngày chưa có commit)"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
